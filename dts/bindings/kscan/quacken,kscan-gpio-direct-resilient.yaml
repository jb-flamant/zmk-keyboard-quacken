description: |
  Direct GPIO keyboard KSCAN controller, resilient to read errors.

  Same as `zmk,kscan-gpio-direct`, but a failed read (e.g. an I2C error on an
  IO expander) is retried on the next scan period instead of stopping the scan.

compatible: "quacken,kscan-gpio-direct-resilient"

include: kscan.yaml

properties:
  input-gpios:
    type: phandle-array
    required: false
  input-keys:
    type: phandles
    required: false
    description: List of gpio-key references
  debounce-period:
    type: int
    required: false
    deprecated: true
    description: Deprecated. Use debounce-press-ms and debounce-release-ms instead.
  debounce-press-ms:
    type: int
    default: 5
    description: Debounce time for key press in milliseconds. Use 0 for eager debouncing.
  debounce-release-ms:
    type: int
    default: 5
    description: Debounce time for key release in milliseconds.
  debounce-scan-period-ms:
    type: int
    default: 1
    description: Time between reads in milliseconds when any key is pressed.
  poll-period-ms:
    type: int
    default: 10
    description: Time between reads in milliseconds when no key is pressed and ZMK_KSCAN_DIRECT_POLLING is enabled.
  toggle-mode:
    type: boolean
    description: Enable toggle-switch mode.
